<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - Team Schedule</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Team Schedule</h1>
        <p class="login-sub">팀원 일정 공유 시스템</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash" style="text-align:left; white-space: pre-line;">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="user_code">사용자코드</label>
            <input type="text" id="user_code" name="user_code" placeholder="USER001" autocomplete="off" autofocus required>
            <button type="submit" class="btn">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
